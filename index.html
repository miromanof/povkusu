function swipe(v){let d=deck[S.card];if(!d)return;if(v!=='skip'){S.likes=S.likes.filter(id=>id!==d.id);S.dislikes=S.dislikes.filter(id=>id!==d.id);if(v==='yes')S.likes.push(d.id);if(v==='no')S.dislikes.push(d.id)}S.card++;render()}
function slots(){return S.meals===2?['breakfast','main']:S.meals===3?['breakfast','main','main']:S.meals===4?['breakfast','main','snack','main']:['breakfast','snack','main','snack','main']}
function mealNames(){return S.meals===2?['Завтрак','Основной приём']:S.meals===3?['Завтрак','Обед','Ужин']:S.meals===4?['Завтрак','Обед','Перекус','Ужин']:['Завтрак','Перекус','Обед','Перекус','Ужин']}
function cart(plan=S.plan){let needs={};plan.flat().forEach(id=>{if(id==null)return;Object.entries(dishes[id].i).forEach(([k,v])=>needs[k]=(needs[k]||0)+v*portions())});let items=Object.entries(needs).filter(([k])=>!S.pantry.includes(k)).map(([k,need])=>{let [n,size,p,unit]=products[k],packs=Math.ceil(need/size);return{k,n,size,unit,need,packs,cost:Math.round(packs*p*factor())}});return{items,total:items.reduce((a,it)=>a+it.cost,0)}}
// Swipes describe taste; only explicit restrictions decide eligibility.
function tasteFeatures(d){
 const f={};for(const k of Object.keys(d.i))f[k]=['onion','carrot','milk'].includes(k)?.15:1;
 const style=/суп/.test(d.n)?'soup':/салат/.test(d.n)?'salad':/каша|Овсянка|Рис с яблоком/.test(d.n)?'porridge':/Паста/.test(d.n)?'pasta':'plate';
 f['style:'+style]=.8;f['method:'+(d.eq||'raw')]=.35;return f;
}
function tasteSimilarity(a,b){const x=tasteFeatures(a),y=tasteFeatures(b),keys=new Set([...Object.keys(x),...Object.keys(y)]);let common=0,total=0;keys.forEach(k=>{common+=Math.min(x[k]||0,y[k]||0);total+=Math.max(x[k]||0,y[k]||0)});return common/total;}
let tasteMemoKey='',tasteMemo={};
function tasteScore(d){const key=JSON.stringify([S.likes,S.dislikes]);if(key!==tasteMemoKey){tasteMemoKey=key;tasteMemo={}}if(d.id in tasteMemo)return tasteMemo[d.id];const avg=ids=>ids.length?ids.reduce((s,id)=>s+(dishes[id]?tasteSimilarity(d,dishes[id]):0),0)/ids.length:0;return tasteMemo[d.id]=avg(S.likes)-avg(S.dislikes);}
const familyMemo={};
function dishFamily(d){if(familyMemo[d.id])return familyMemo[d.id];return familyMemo[d.id]=d.family||(/суп|Щи/.test(d.n)?'soup':/салат/i.test(d.n)?'salad':'pasta' in d.i?'pasta':'rice' in d.i?'rice':'buckwheat' in d.i?'buckwheat':'potato' in d.i?'potato':'cabbage' in d.i?'stew':'beans' in d.i?'beans':'lentil' in d.i?'lentil':'egg' in d.i?'eggs':'fish' in d.i?'fish':'chicken' in d.i?'poultry':d.kind);}
function varietyStats(plan){const families={},counts={};let sameDay=0,neighbors=0;plan.forEach((day,di)=>{const daily={};day.forEach(id=>{counts[id]=(counts[id]||0)+1;const d=dishes[id];if(d.kind!=='main')return;const f=dishFamily(d);families[f]=(families[f]||0)+1;daily[f]=(daily[f]||0)+1;if(di&&plan[di-1].some(prev=>dishes[prev].kind==='main'&&dishFamily(dishes[prev])===f))neighbors++;});sameDay+=Object.values(daily).reduce((s,n)=>s+Math.max(0,n-1),0)});
 const excess=Object.entries(families).reduce((s,[f,n])=>s+Math.max(0,n-(f==='pasta'?2:3)),0);const recipeExcess=Object.values(counts).reduce((s,n)=>s+Math.max(0,n-2),0);
 const readySameDay=plan.reduce((sum,day)=>sum+Math.max(0,day.filter(id=>dishes[id].ready).length-1),0);return{families,counts,sameDay,neighbors,excess,recipeExcess,readySameDay};
}
function planQuality(plan){const ids=plan.flat(),stats=varietyStats(plan);
 const readyCount=ids.filter(id=>dishes[id].ready).length;const readyTarget=S.readyFood?Math.min(7,dishes.filter(d=>d.ready&&allowed(d)).length*2):0;return -Math.max(0,readyTarget-readyCount)*15000-stats.excess*1000000-stats.sameDay*100000-stats.readySameDay*100000-stats.recipeExcess*30000+Object.keys(stats.counts).length*10000+Object.keys(stats.families).length*3000-stats.neighbors*500-Object.values(stats.counts).reduce((s,n)=>s+n*n,0)*10+ids.reduce((s,id)=>s+tasteScore(dishes[id])*15,0);
}
function buildPlan(){
 const kinds=[...new Set(slots())],pools=Object.fromEntries(kinds.map(kind=>[kind,dishes.filter(d=>allowed(d)&&d.kind===kind)]));
 if(kinds.some(kind=>!pools[kind].length)){S.plan=[];S.planMeta={affordable:false,available:0};return;}
 const shape=ids=>Array.from({length:7},()=>slots().map(kind=>ids[kinds.indexOf(kind)]));
 let seed=null,cheapest=Infinity;
 function seeds(i,ids){if(i===kinds.length){const plan=shape(ids),cost=cart(plan).total;if(cost<cheapest-0.001||(Math.abs(cost-cheapest)<.001&&planQuality(plan)>planQuality(seed))){cheapest=cost;seed=plan}return;}for(const d of pools[kinds[i]])seeds(i+1,[...ids,d.id]);}
 seeds(0,[]);
 let current=seed,currentCost=cheapest,best=seed,bestQuality=planQuality(seed),bestAffordable=cheapest<=S.budget,visited=new Set();
 const available=new Set(Object.values(pools).flat().map(d=>d.id)).size;
 // The same budget-independent path is considered at every budget. Selecting
 // the best affordable candidate prioritizes ingredient-family balance.
 for(let step=0;step<60;step++){
  let chosen=null,chosenCost=0,chosenQuality=0,rank=-Infinity;const quality=planQuality(current);
  for(let di=0;di<7;di++)for(let mi=0;mi<slots().length;mi++)for(const d of pools[slots()[mi]]){
   const old=current[di][mi];if(old===d.id)continue;current[di][mi]=d.id;
   const q=planQuality(current);if(q>quality+.001){const cost=cart(current).total;const gain=q-quality;const r=gain/(1+Math.max(0,cost-currentCost));
    if(r>rank+.000001){rank=r;chosen=current.map(day=>day.slice());chosenCost=cost;chosenQuality=q;}}
   current[di][mi]=old;
  }
  if(!chosen)break;current=chosen;currentCost=chosenCost;
  if(currentCost<=S.budget&&(!bestAffordable||chosenQuality>bestQuality)){best=current;bestQuality=chosenQuality;bestAffordable=true;}
  const key=current.flat().join(',');if(visited.has(key))break;visited.add(key);
 }
 S.plan=best.map(day=>day.slice());S.checked=[];S.planMeta={affordable:bestAffordable,available,unique:new Set(best.flat()).size};
}
function replaceMeal(di,mi){
 const old=S.plan[di][mi],before=cart().total,pool=dishes.filter(d=>allowed(d)&&d.kind===slots()[mi]&&d.id!==old);let best=null,score=-Infinity;
 const baseline=varietyStats(S.plan);
 for(const d of pool){S.plan[di][mi]=d.id;const cost=cart().total,q=planQuality(S.plan),stats=varietyStats(S.plan);if((stats.families.pasta||0)<=Math.max(2,baseline.families.pasta||0)&&stats.excess<=baseline.excess&&stats.sameDay<=baseline.sameDay&&stats.readySameDay<=baseline.readySameDay&&(cost<=S.budget||before>S.budget&&cost<before)&&q>score){score=q;best=d.id;}}
 S.plan[di][mi]=best??old;S.checked=[];render();if(best===null)toast('Другой вариант в этом бюджете не найден');

function useCatalog(){return S.priceMode==='catalog'&&!!catalogRegistry[S.store]}
function applyCatalog(){catalogData=catalogRegistry[S.store]||catalogRegistry['Слата'];catalogRows=Object.fromEntries(catalogData.products.map(p=>[p.ingredient,p]));Object.keys(products).forEach(k=>{products[k]=[...originalProducts[k]];if(useCatalog()&&catalogRows[k]){products[k][1]=catalogRows[k].size;products[k][2]=catalogRows[k].price;products[k][3]=catalogRows[k].unit}})}
const catalogBeforePrepared=applyCatalog;applyCatalog=function(){catalogBeforePrepared();if(S.readyFood&&useCatalog())for(const p of preparedFood.entries.filter(p=>p.store===S.store)){catalogRows[p.ingredient]={...p,unit:'г'};products[p.ingredient]=[p.name,p.size,p.price,'г']}};
const previousFactor=factor;
factor=function(){return S.priceMode==='catalog'?1:previousFactor()};
const previousAllowed=allowed;
allowed=function(d){return previousAllowed(d)&&(S.priceMode!=='catalog'||(useCatalog()&&Object.keys(d.i).every(k=>catalogRows[k])))};
function effectivePantry(){return new Set([...S.pantry,...S.customPantry.flatMap(resolveFood)])}
cart=function(plan=S.plan){let needs={};plan.flat().forEach(id=>{if(id==null)return;Object.entries(dishes[id].i).forEach(([k,v])=>needs[k]=(needs[k]||0)+v*portions())});let pantry=effectivePantry(),missing=[];
let items=Object.entries(needs).filter(([k])=>!pantry.has(k)).map(([k,need])=>{let [n,size,p,unit]=products[k],row=useCatalog()?catalogRows[k]:null,unknown=S.priceMode==='catalog'&&!row;if(unknown)missing.push(k);let weighted=!!row?.weighted,packs=weighted?null:Math.ceil((need-1e-8)/size),quantity=weighted?Math.ceil(need/100)*100: packs*size,cost=unknown?null:Math.round((weighted?quantity/size:packs)*p*factor()*100)/100;
return{k,n:row?.name||n,size,unit,need,packs,weighted,quantity,cost,url:row?.url,unknown}});return{items,missing,total:missing.length?Infinity:Math.round(items.reduce((a,it)=>a+it.cost,0)*100)/100}};
const previousRender=render;
render=function(){applyCatalog();previousRender();const root=$('screen').querySelector('.fade');if(!root)return;const status=storeStatus[S.store],captured=new Date(catalogData.capturedAt).toLocaleString('ru-RU',{timeZone:'Asia/Irkutsk',dateStyle:'short',timeStyle:'short'});
let note=document.querySelector('.bottom-mark');if(note)note.textContent=S.priceMode==='demo'?'✳ Демо · тестовые цены':useCatalog()?'✳ '+S.store+' · срез цен от '+captured:'✳ Каталог магазина не подключён';
if(S.step===0){root.querySelectorAll('.option').forEach(button=>{let name=button.querySelector('strong')?.textContent;let sub=button.querySelector('small');if(sub&&storeStatus[name])sub.textContent=catalogRegistry[name]?'Цены импортированы · '+catalogRegistry[name].products.length+' ингредиентов':'Каталог пока не подключён'});let banner=root.querySelector('.banner');banner.innerHTML='<strong>'+ (S.priceMode==='demo'?'Демонстрационный режим':useCatalog()?'Каталог «'+S.store+'»: Иркутск':'Цены ещё не подключены')+'</strong>'+ (S.priceMode==='demo'?'Условные цены для проверки интерфейса.':status.message)+'<br><a href="'+status.url+'" target="_blank" rel="noopener">Открыть сайт магазина</a>'+(useCatalog()?'<p>Проверено '+captured+' (Иркутск). '+(catalogData.location||'Интернет-магазин Слаты')+'. '+(catalogData.priceType==='base-before-promotions'?'Базовые цены до акций; скидки не учтены. ':'')+'Сохранённый срез, без карт лояльности. Цены на полке и наличие могут отличаться.</p>':'');
let controls=document.createElement('div');controls.className='chips';controls.style.marginTop='18px';controls.innerHTML='<button class="chip '+(S.priceMode==='catalog'?'selected':'')+'" onclick="set(\'priceMode\',\'catalog\')">Цены из каталога</button><button class="chip '+(S.priceMode==='demo'?'selected':'')+'" onclick="set(\'priceMode\',\'demo\')">Демо с тестовыми ценами</button>';root.insertBefore(controls,root.querySelector('.actions'));let library=document.createElement('p');library.innerHTML='<a href="recipes.html" target="_blank" rel="noopener">Библиотека TheMealDB · 790 рецептов</a>';root.insertBefore(library,root.querySelector('.actions'));let nextButton=root.querySelector('.actions .primary');nextButton.disabled=S.priceMode==='catalog'&&!useCatalog();
if(useCatalog()){let details=document.createElement('details');details.className='custom-section';details.innerHTML='<summary>Посмотреть товары и источники ('+catalogData.products.length+')</summary><p>Конкретные товары подобраны для ингредиентов прототипа. Это не полный ассортимент магазина. '+('Подтверждено '+catalogData.products.length+' из 20 ингредиентов. Блюда с неподтверждёнными ингредиентами не предлагаются.')+'</p>'+catalogData.products.map(p=>'<div class="shopping"><span><a href="'+p.url+'" target="_blank" rel="noopener">'+safe(p.name)+'</a><small>'+p.size+' '+p.unit+(p.weighted?' · весовой товар':' · упаковка')+'</small></span><b>'+p.price.toFixed(2)+' ₽</b></div>').join('');root.insertBefore(details,root.querySelector('.actions'))}}
if(S.step===7&&useCatalog()){root.querySelectorAll('.tag').forEach(el=>{if(el.textContent.includes('/ порция'))el.textContent+=' · по срезу цен'})}
if(S.step===8&&S.plan.length){let info=document.createElement('div');info.className='banner';let unique=new Set(S.plan.flat()).size;let available=[...new Set(slots())].reduce((sum,kind)=>sum+Math.min(7*slots().filter(k=>k===kind).length,dishes.filter(d=>allowed(d)&&d.kind===kind).length),0);info.innerHTML='<strong>'+unique+' разных блюд на неделю</strong>'+ 'Повторных подач: '+(S.plan.flat().length-unique)+'. Свайпы учитывают вкусы, бюджет — разнообразие. '+(unique>=Math.min(available,S.plan.flat().length)?'Разнообразие ограничено доступными рецептами и настройками кухни.':'Выбор ограничивают бюджет, ассортимент магазина и настройки кухни.')+' Всю сумму тратить не обязательно.'+varietySummaryHtml();let tabs=root.querySelector('.tabs');if(tabs)root.insertBefore(info,tabs);}
if(S.step===8&&useCatalog()){let sub=root.querySelector('.sub');if(sub)sub.textContent+=' · срез цен от '+captured;root.querySelectorAll('.total small').forEach(el=>{el.textContent=el.textContent.replace('Тестовая стоимость','По срезу каталога')});let banner=root.querySelector('.banner');if(S.tab==='cart'&&banner)banner.innerHTML='<strong>Покупки по каталогу «'+S.store+'»</strong>Упаковки округлены вверх. Весовые продукты — до 100 г. Цены сохранены '+captured+'; обновление автоматически не выполняется. Доставка не включена.'+(catalogData.priceType==='base-before-promotions'?' Расчёт по базовым ценам до акций; сумма на сайте может быть ниже.':'');if(S.tab==='cart'){let rows=root.querySelectorAll('.shopping');cart().items.forEach((item,index)=>{let el=rows[index];if(!el)return;let small=el.querySelector('small');small.textContent=item.weighted?'Купить '+item.quantity+' '+item.unit+' · '+(catalogRows[item.k].price/catalogRows[item.k].size*1000).toFixed(2)+' ₽/кг':item.packs+' × '+item.size+' '+item.unit+' · нужно '+Math.ceil(item.need)+' '+item.unit;let name=el.querySelector('strong');if(item.url){let link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener';link.textContent=item.n;name.textContent='';name.appendChild(link)}let cost=el.querySelector('b');cost.textContent=item.cost.toFixed(2)+' ₽'});}root.querySelectorAll('.hint').forEach(el=>{if(el.textContent.startsWith('Тестовые цены, не предложение магазина.'))el.textContent=el.textContent.replace('Тестовые цены, не предложение магазина.','Сохранённые '+(catalogData.priceType==='base-before-promotions'?'базовые цены до акций':'цены интернет-магазина')+', без карты лояльности. Не подтверждают наличие в конкретной торговой точке.');});}
};
copyList=async function(){let c=cart(),text='По вкусу · '+S.store+'\n'+(useCatalog()?'Срез цен '+catalogData.capturedAt:'Тестовые цены')+'\n'+c.items.map(i=>i.n+': '+(i.weighted?i.quantity+' '+i.unit:i.packs+' × '+i.size+' '+i.unit)+' — '+i.cost.toFixed(2)+' ₽'+(i.url?'\n'+i.url:'')).join('\n')+'\nИтого: '+c.total.toFixed(2)+' ₽';try{await navigator.clipboard.writeText(text);toast('Список скопирован')}catch{toast('Копирование недоступно в этом браузере')}};
